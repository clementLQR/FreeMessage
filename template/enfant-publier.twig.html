{% extends 'parent-footer.twig.html' %}
{% block title %}Publier{% endblock %}

{% block style %}
<style>
    .formPublier {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
    }

    .formPublier label {
        color: var(--texte-2);
        font-weight: 400;
        font-size: 0.875em;
    }

    .formPublier input[type="file"],
    .formPublier select,
    .formPublier textarea {
        padding: 10px;
        border: 1px solid var(--bordure);
        border-radius: 5px;
        background-color: var(--surface);
        color: var(--texte);
        font-family: 'Public Sans', sans-serif;
        font-size: 0.875em;
        width: 100%;
    }

    .formPublier input[type="file"]::file-selector-button {
        padding: 8px 16px;
        margin-right: 10px;
        border: 2px solid var(--bleu-profond);
        border-radius: 10px;
        background-color: var(--surface);
        color: var(--bleu-profond);
        font-weight: 700;
        font-family: 'Public Sans', sans-serif;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .formPublier input[type="file"]::file-selector-button:hover {
        background-color: var(--bleu-clair);
        transform: translateY(-2px);
    }

    .formPublier textarea {
        min-height: 120px;
        resize: vertical;
    }

    .formPublier select:focus,
    .formPublier textarea:focus {
        outline: none;
        border-color: var(--bleu-profond);
    }

    .formPublier #previewImage {
        border-radius: 5px;
        border: 1px solid var(--bordure);
    }

    .formPublier button {
        margin-top: 10px;
    }

</style>
{% endblock %}

{% block header %}
<h1>Publier un message</h1>
{% endblock %}


{% block contenu %}
<form method="post" action="{{ base_path }}/publier" enctype="multipart/form-data" class="formPublier">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="image-upload">
        <label for="image"><strong>Image</strong></label>
        <input type="file" name="image" accept="image/*">
        <img id="previewImage" src="#" alt="Aperçu de l'image"
            style="display:none; max-width: 200px; margin-top: 10px;">
    </div>
    <label for="idCat"><strong>Catégorie *</strong></label>
    <select name="idCat" id="idCat" required>
        <option value="">Choisir une catégorie</option>
        {% for categorie in categories %}
        <option value="{{ categorie.IdCat }}">{{ categorie.nom }}</option>
        {% endfor %}
    </select>
    <label for="texte"><strong>Texte *</strong></label>
    <textarea id="texte" name="texte" required></textarea>
    <input type="hidden" name="idUser" value="{{ utilisateur.IdUser }}">
    <button type="submit" class="btn-primary">Publier</button>

    <script>
        document.querySelector('input[name="image"]').addEventListener('change', function (event) {
            const preview = document.getElementById('previewImage');
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            } else {
                preview.src = '#';
                preview.style.display = 'none';
            }
        });
    </script>
</form>
{% endblock %}
