{% extends 'parent-footer.twig.html' %}
{% block title %}Paramètres{% endblock %}
{% block style %}
<style>
    header {
        display: flex;
        gap: 10px;
    }

    header img {
        width: 25px;
        height: 25px;
        cursor: pointer;
        position: relative;
        top: 3px;
    }

    .parametre-container a{
        text-decoration: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .parametre-container a img, button img {
        width: 15px;
        height: 15px;
        position: relative;
    }

    .parametre-container a div img, button img {
        margin-right: 10px;
    }

    .parametre-container a div {
        font-weight: 700;
    }

    .parametre-container a img{
        filter: invert(36%) sepia(19%) saturate(2256%) hue-rotate(151deg) brightness(91%) contrast(89%);
    }

    button {
        display: flex;
        align-items: center;
        width: 100%;
        font-size: 1em;
    }

    .parametre-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 20px;
    }
</style>

{% endblock %}

{% block header %}
<a href="{{ base_path }}/profil"><img src="{{ base_path }}/images/chevron-gauche.svg" alt="retourner en arrière"></a>
<h1>Paramètres</h1>
{% endblock %}


{% block contenu %}
<div class="parametre-container">
    <a href="{{ base_path }}/biographie" class="btn-secondary">
        <div>
            <img src="{{ base_path }}/images/modifier.svg" alt="modifier la biographie">
            Modifier la biographie
        </div>
        <img src="{{ base_path }}/images/chevron-droit.svg" alt="chevron droit"> 
    </a>

    <a href="{{ base_path }}/identifiant" class="btn-secondary">
        <div>
            <img src="{{ base_path }}/images/modifier.svg" alt="modifier l'identifiant">
            Changer d'identifiant
        </div>
        <img src="{{ base_path }}/images/chevron-droit.svg" alt="chevron droit">
    </a>

    <form method="post" action="{{ base_path }}/deconnexion">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="btn-rouge" type="submit"><img src="{{ base_path }}/images/deconnexion.svg" alt="Déconnexion"> Déconnexion</button>
    </form>
</div>
{% endblock %}
