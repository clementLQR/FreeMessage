<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<style>

    /* -------------------GLOBAL------------------ */

    :root {
        --fond: #F4F7F9;
        --surface: #FFFFFF;
        --bleu-clair: #A9D0E0;
        --bleu-profond: #1C6E8C;
        --texte: #1B2228;
        --texte-2: #5A6672;
        --bordure: #DDE4E9;
        --rouge: #B3261E;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Public Sans', sans-serif;
        font-weight: 400;
        scrollbar-width: thin;
        scrollbar-color: var(--bleu-profond) transparent;
    }

    body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    header {
        padding: 10px 20px;
        border-bottom: 1px solid var(--bordure);
    }

    h1, h2, h3, h4{
        font-family: 'Bricolage Grotesque', sans-serif;
        font-weight: 700;
    }

    h1{
        text-transform: uppercase;
        font-size: 1.7em;
    }

    .btn-primary, .btn-secondary, .btn-rouge {
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        transition: all 0.3s ease;
    }

    .btn-primary {
        background-color: var(--bleu-profond);
        color: var(--surface);
        border: 2px solid var(--bleu-profond);
    }

    .btn-primary img {
        width: 20px;
        height: 20px;
        filter: invert(1) ;
    }

    .btn-primary:hover, .btn-secondary:hover, .btn-rouge:hover {
        transform: translateY(-2px);
    }

    .btn-secondary {
        background-color: var(--surface);
        border: 2px solid var(--bleu-profond);
        color: var(--bleu-profond);
    }

    .btn-rouge {
        background-color: var(--surface);
        color: var(--rouge);
        border: 2px solid var(--rouge);
    }

    .radio-toggle {
        display: flex;
        width: fit-content;
        border: 2px solid var(--bordure);
        background-color: var(--surface);
        border-radius: 10px;
        overflow: hidden;
        padding: 2px;
    }

    .radio-toggle input[type="radio"] {
        display: none;
    }

    .radio-toggle label {
        padding: 10px 20px;
        cursor: pointer;
        font-weight: 700;
        color: var(--texte-2);
        background-color: var(--surface);
        transition: background-color 0.3s ease;
        border-radius: 7px;
        width: 100%;
        text-align: center;
    }

    .radio-toggle input[type="radio"]:checked + label {
        background-color: var(--bleu-clair);
        color: var(--bleu-profond);
    }

    footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background-color: var(--surface);
        border-top: 1px solid var(--bordure);
        display: flex;
        justify-content: space-around;
        padding: 10px 0;
    }

    footer a {
        width: 30px;
        height: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: var(--texte-2);
        font-size: 0.75em;
    }

    footer a img {
        filter: invert(30%) sepia(0%) saturate(0%) hue-rotate(180deg) brightness(90%) contrast(85%);
    }

    main {
        flex: 1;
        min-height: 0;
        background-color: var(--fond);
        color: var(--texte);
        padding: 20px;

        margin-bottom: 50px; /* Espace pour le footer */

        overflow-x: hidden;
        overflow-y: auto;
    }

    /* -------------------TABLETTE----------------- */

    /* -------------------DESKTOP------------------ */

    @media (min-width: 1024px) {
        body {
            display: grid;
            grid-template-columns: 70px 1fr;
            grid-template-rows: auto 1fr;
            grid-template-areas:
                "sidebar header"
                "sidebar main";
            height: 100vh;
        }

        main {
            margin-bottom: 0;
            padding: 50px 20%;
        }

        header {
            grid-area: header;
        }

        main {
            grid-area: main;
        }

        .footer {
            grid-area: sidebar;
            position: static;
            width: 70px;
            height: 100%;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            gap: 50px;
            padding: 20px 10px;
            border-top: none;
            border-right: 1px solid var(--bordure);
        }

        .footer a {
            width: 100%;
            justify-content: center;
        }
    }

</style>
{% block style %}{% endblock %}

<body>
    
    <header>
        {% block header %}
        {% endblock %}
    </header>

    <main>
        {% block contenu %}

        </b>ores doloribus quae hic! Atque fuga quo ipsum dolores magni amet voluptatibus esse itaque.
        {% endblock %}
    </main>

    <footer class="footer">
        <a href="{{ base_path }}/"><img src="{{ base_path }}/images/accueil.svg" alt="accueil">Accueil</a>
        <a href="{{ base_path }}/publier"><img src="{{ base_path }}/images/publier.svg" alt="publier">Publier</a>
        <a href="{{ base_path }}/profil"><img src="{{ base_path }}/images/profil.svg" alt="profil">Profil</a>
    </footer>

</body>

</html>
