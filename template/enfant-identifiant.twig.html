{% extends 'parent-footer.twig.html' %}
{% block title %}Identifiant{% endblock %}

{% block style %}
<style>
   
</style>
{% endblock %}


{% block header %}
<h1>Changer d'identifiant</h1>
{% endblock %}


{% block contenu %}
<form method="post" action="{{ base_path }}/identifiant">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="identifiant">Ecrivez votre nouvel identifiant :</label>
    <textarea id="identifiant" name="identifiant"></textarea>
    <div class="buttons">
        <button type="submit">Enregistrer</button>
        <a href="{{ base_path }}/parametre"><button type="button">Annuler</button></a>
    </div>
</form>
{% endblock %}
